<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiBar</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="brand">
          <span class="logo">π</span> <span class="brand-name">PiBar</span>
          <button
            class="icon-btn panel-btn"
            id="tg-left"
            data-i18n-title="Show/hide sessions (⌘B)"
            title="Show/hide sessions (⌘B)"
          >
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="1.5" y="2.5" width="13" height="11" rx="2" />
              <line x1="6" y1="2.5" x2="6" y2="13.5" />
            </svg>
          </button>
        </div>
        <div class="tb-session" id="tb-session" data-i18n="No session">No session</div>
        <div class="tb-controls">
          <label
            class="tb-field"
            id="fld-preset"
            data-i18n-title="Preset: model and thinking level"
            title="Preset: model and thinking level"
            hidden
          >
            <span data-i18n="Preset">Preset</span>
            <select id="sel-preset" disabled></select>
          </label>
          <label class="tb-field" id="fld-model" data-i18n-title="Model of this session" title="Model of this session">
            <span data-i18n="Model">Model</span>
            <select id="sel-model" disabled></select>
          </label>
          <label
            class="tb-field"
            id="fld-thinking"
            data-i18n-title="Thinking level of this session"
            title="Thinking level of this session"
          >
            <span data-i18n="Thinking">Thinking</span>
            <select id="sel-thinking" disabled></select>
          </label>
          <button class="icon-btn" id="btn-default" disabled></button>
          <div class="tb-field" id="fld-view">
            <span data-i18n="View">View</span>
            <button type="button" class="dd-btn" id="sel-view" aria-haspopup="menu"></button>
          </div>
          <div class="tb-field" id="fld-answer">
            <span data-i18n="Answers">Answers</span>
            <button type="button" class="dd-btn" id="sel-answer" aria-haspopup="menu"></button>
          </div>
          <button class="icon-btn panel-btn" id="tg-right" data-i18n-title="Show/hide folders and files (⌥⌘B)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <rect x="1.5" y="2.5" width="13" height="11" rx="2" />
              <line x1="10" y1="2.5" x2="10" y2="13.5" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-theme" data-i18n-title="Colour scheme: automatic / light / dark"></button>
          <button class="icon-btn" id="btn-settings" data-i18n-title="Settings">
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            >
              <circle cx="8" cy="8" r="2.2" />
              <circle cx="8" cy="8" r="4.6" />
              <path
                d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"
              />
            </svg>
          </button>
        </div>
      </header>

      <aside class="sidebar">
        <div class="pane-head">
          <span data-i18n="Sessions">Sessions</span>
          <span>
            <button class="icon-btn" id="btn-session-view" data-i18n-title="Sort and sections">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M2.5 4h11M4.5 8h7M6.5 12h3" />
              </svg>
            </button>
            <button class="icon-btn" id="btn-cleanup" data-i18n-title="Tidy up: move sessions to the archive">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <rect x="1.75" y="2.5" width="12.5" height="3.5" rx="1" />
                <path d="M3 6v6.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6M6.5 8.75h3" />
              </svg>
            </button>
            <button class="icon-btn" id="btn-refresh" data-i18n-title="Reload all">↻</button>
            <button class="icon-btn" id="btn-new" data-i18n-title="New session (⌘N)">＋</button>
          </span>
        </div>
        <div id="host-tabs" class="host-tabs"></div>
        <div id="reminders" class="reminders" hidden></div>
        <div id="host-list" class="host-list"></div>
        <div id="sess-drop" class="sess-drop" hidden>
          <div class="dz" data-drop="pin" data-i18n="Pin">Pin</div>
          <div class="dz" data-drop="ungroup" data-i18n="Ungrouped">Ungrouped</div>
          <div class="dz" data-drop="new" data-i18n="New group">New group</div>
        </div>
        <div id="sel-bar" class="sel-bar" hidden></div>
        <div class="resizer" id="rs-left" data-i18n-title="Drag to resize"></div>
      </aside>

      <main class="chat">
        <div id="chat-scroll" class="chat-scroll">
          <div id="empty" class="empty">
            <div class="empty-logo">π</div>
            <h2 data-i18n="Welcome to PiBar">Welcome to PiBar</h2>
            <p data-i18n="Open a session on the left or start a new one.">
              Open a session on the left or start a new one.
            </p>
            <button class="primary" id="btn-new-empty" data-i18n="New session">New session</button>
          </div>
        </div>
        <div id="activity" class="activity" hidden></div>
        <div id="queue-bar" class="queue-bar" hidden></div>
        <div id="question-bar" class="undo-bar question-bar" hidden>
          <span data-i18n="Pi asks for a choice.">Pi asks for a choice.</span>
          <button type="button" class="primary small" id="btn-answer" data-i18n="Answer …">Answer …</button>
          <button type="button" class="icon-btn" id="btn-question-close" data-i18n-title="Dismiss">×</button>
        </div>
        <div id="undo-bar" class="undo-bar" hidden>
          <span data-i18n="You are in a new branch; the previous version is kept.">
            You are in a new branch; the previous version is kept.
          </span>
          <button type="button" class="ghost small" id="btn-undo" data-i18n="Undo">Undo</button>
          <button type="button" class="icon-btn" id="btn-undo-close" data-i18n-title="Keep the branch">×</button>
        </div>
        <form id="composer" class="composer">
          <div id="slash-menu" class="slash-menu" hidden></div>
          <div class="dock" id="dock">
            <div class="dock-pop" id="dock-pop">
              <button
                type="button"
                id="btn-attach"
                class="icon-btn"
                data-i18n-title="Attach files (also drag & drop or paste)"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                >
                  <path
                    d="M13 7.5l-5.2 5.2a3.2 3.2 0 0 1-4.5-4.5L8.6 2.9a2.1 2.1 0 0 1 3 3L6.4 11.1a1 1 0 0 1-1.5-1.5L9.7 4.8"
                  />
                </svg>
              </button>
              <button type="button" id="btn-shot" class="icon-btn" data-i18n-title="Screenshot: drag an area">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                >
                  <path
                    d="M2 5.5V3.5A1.5 1.5 0 0 1 3.5 2h2M10.5 2h2A1.5 1.5 0 0 1 14 3.5v2M14 10.5v2a1.5 1.5 0 0 1-1.5 1.5h-2M5.5 14h-2A1.5 1.5 0 0 1 2 12.5v-2"
                  />
                  <circle cx="8" cy="8" r="2.3" />
                </svg>
              </button>
              <button
                type="button"
                id="btn-slash"
                class="icon-btn slash-btn"
                data-i18n-title="Skills and commands (type /)"
                disabled
              >
                /
              </button>
              <button type="button" id="btn-tools" class="icon-btn" data-i18n-title="Tools of this session" disabled>
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M10.2 2.2a3.3 3.3 0 0 0-3.9 4.4L2.2 10.7a1.4 1.4 0 0 0 2 2l4.1-4.1a3.3 3.3 0 0 0 4.4-3.9l-1.9 1.9-1.6-.4-.4-1.6z"
                  />
                </svg>
              </button>
            </div>
            <button
              type="button"
              id="btn-dock"
              class="icon-btn dock-main"
              data-i18n-title="More: attach files, screenshot, skills, tools"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              >
                <path d="M8 3v10M3 8h10" />
              </svg>
            </button>
          </div>
          <div class="input-wrap">
            <div id="attach-row" class="attach-row" hidden></div>
            <textarea
              id="input"
              rows="1"
              data-i18n-placeholder="Message to Pi …  (Enter to send, Shift+Enter for a new line)"
              disabled
            ></textarea>
          </div>
          <input type="file" id="file-input" multiple hidden />
          <div class="composer-actions">
            <button
              type="button"
              id="btn-improve"
              class="icon-btn voice-btn"
              data-i18n-title="Improve the text with the second LLM"
              hidden
            >
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path
                  d="M7 1.5l1.3 3.7L12 6.5 8.3 7.8 7 11.5 5.7 7.8 2 6.5l3.7-1.3zM12.5 10l.6 1.6 1.4.4-1.4.5-.6 1.5-.5-1.5-1.5-.5 1.5-.4z"
                />
              </svg>
            </button>
            <button
              type="button"
              id="btn-mic"
              class="icon-btn voice-btn"
              data-i18n-title="Dictate (click to start and stop, Esc cancels)"
              hidden
            >
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" />
                <path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2" />
              </svg>
            </button>
            <button type="submit" id="btn-send" class="send-btn" disabled data-i18n-title="Send (Enter)"></button>
          </div>
        </form>
        <div class="status-line" id="usage-wrap">
          <span class="usage" id="usage"></span>
          <span class="usage-model" id="usage-model"></span>
          <div class="usage-pop" id="usage-pop"></div>
        </div>
      </main>

      <aside class="files">
        <div class="resizer left" id="rs-right" data-i18n-title="Drag to resize"></div>
        <div class="pane-head">
          <span data-i18n="Session folders">Session folders</span>
          <button class="icon-btn" id="btn-files-filter" data-i18n-title="Show only Markdown, HTML and images">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
              <path d="M2 3h12l-4.5 5.5V13l-3 1.5V8.5z" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-reload-files" data-i18n-title="Reload files and Git status (⌘⇧R)" disabled>
            ↻
          </button>
          <button class="icon-btn" id="btn-add-folder" data-i18n-title="New file or folder" disabled>＋</button>
        </div>
        <div id="file-tree" class="file-tree">
          <p class="muted pad" data-i18n="No session open.">No session open.</p>
        </div>
        <div class="hsplit" id="rs-files" hidden data-i18n-title="Drag to resize"></div>
        <div id="editor" class="editor" hidden>
          <div class="editor-head">
            <span id="editor-name" class="editor-name"></span>
            <div class="seg">
              <button id="ed-edit" class="seg-btn active" data-i18n="Edit">Edit</button>
              <button id="ed-preview" class="seg-btn" data-i18n="Preview">Preview</button>
              <button id="ed-diff" class="seg-btn" data-i18n="Diff">Diff</button>
            </div>
            <button id="ed-save" class="primary small" disabled data-i18n="Save">Save</button>
            <button id="ed-close" class="icon-btn" data-i18n-title="Close">×</button>
          </div>
          <textarea id="ed-text" class="ed-text" spellcheck="false"></textarea>
          <div id="ed-render" class="ed-render md" hidden></div>
          <div id="ed-diff-view" class="ed-diff" hidden></div>
        </div>
      </aside>
    </div>

    <div id="modal-root"></div>
    <div id="toasts" class="toasts"></div>
    <script type="module" src="/src/main/index.ts"></script>
  </body>
</html>
