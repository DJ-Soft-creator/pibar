services:
  webapp:
    build:
      # the client bundles src/shared/ of the desktop app → build from the repository root
      context: ..
      dockerfile: webapp/Dockerfile
    ports:
      - "8787:8787"
    # Compose >= 2.24: works without a .env file.
    env_file:
      - path: .env
        required: false
    environment:
      # Persistence: the named volume is mounted at /data. `environment` beats
      # `env_file`, so a DATA_DIR in .env can never bypass the volume.
      DATA_DIR: /data
    volumes:
      - webapp-data:/data
      # SSH key (id_ed25519), known_hosts and optionally an ssh config for the Pi hosts; see README
      - ${SSH_KEY_DIR:-./ssh}:/ssh:ro
    restart: unless-stopped

volumes:
  webapp-data:
